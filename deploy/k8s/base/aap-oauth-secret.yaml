apiVersion: v1
kind: Secret
metadata:
  name: aap-oauth-secret
type: Opaque
stringData:
  # AAP Instance URL (optional - pre-fills the login form)
  # If set, users won't need to type the AAP URL
  AAP_BASE_URL: "https://aap.example.com"

  # AAP OAuth Application Credentials
  # Create an OAuth2 Application in AAP (Settings -> Applications)
  # Authorization Grant Type: authorization-code
  # Redirect URIs: https://eda-playground.apps.example.com/auth/callback
  AAP_CLIENT_ID: "eda-playground-client"
  AAP_CLIENT_SECRET: "REPLACE_WITH_ACTUAL_SECRET_FROM_AAP"
  AAP_REDIRECT_URI: "https://eda-playground.apps.example.com/auth/callback"

  # Cookie Configuration
  # COOKIE_DOMAIN should match your OpenShift route domain
  COOKIE_DOMAIN: ".apps.example.com"
  COOKIE_SECURE: "true"

  # Session Secret for signing cookies (generate a random string)
  SESSION_SECRET: "REPLACE_WITH_RANDOM_SECRET_STRING"
