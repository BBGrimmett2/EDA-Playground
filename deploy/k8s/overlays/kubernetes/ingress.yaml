---
# Alternative to OpenShift Route for standard Kubernetes clusters
# Use this instead of route.yaml if deploying to vanilla Kubernetes
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: eda-playground
  labels:
    app: eda-playground
    app.kubernetes.io/name: eda-playground
    app.kubernetes.io/component: web
  annotations:
    # Uncomment for cert-manager TLS
    # cert-manager.io/cluster-issuer: "letsencrypt-prod"
    # Uncomment for nginx ingress
    # nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx  # Change to your ingress class
  rules:
    - host: eda-playground.example.com  # Change to your domain
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: eda-playground
                port:
                  name: http
  # Uncomment for TLS
  # tls:
  #   - hosts:
  #       - eda-playground.example.com
  #     secretName: eda-playground-tls
