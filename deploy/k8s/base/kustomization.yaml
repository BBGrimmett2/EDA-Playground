---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

metadata:
  name: eda-playground-base

labels:
  - pairs:
      app.kubernetes.io/name: eda-playground
      app.kubernetes.io/component: web
      app.kubernetes.io/managed-by: kustomize

resources:
  - aap-oauth-secret.yaml
  - configmap.yaml
  - deployment.yaml
  - service.yaml

images:
  - name: ghcr.io/bbgrimmett2/eda-playground
    newTag: latest
