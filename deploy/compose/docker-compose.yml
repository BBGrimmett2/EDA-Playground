# Docker Compose file for local testing
# No version needed for Docker Compose v2+

services:
  eda-playground:
    image: eda-playground:local
    container_name: eda-playground
    build:
      context: ../..
      dockerfile: Dockerfile
    ports:
      - "${HOST_PORT:-8080}:8080"
    environment:
      - NODE_ENV=production
      - PORT=8080
      - ALLOW_SELF_SIGNED_CERTS=true
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:8080/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    # Uncomment to mount custom integrations
    # volumes:
    #   - ./integrations:/app/integrations/custom:ro
    labels:
      - "com.example.description=EDA Playground"
      - "com.example.version=1.0.0"
